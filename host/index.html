<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Console - Host</title>
  
  <!-- Styles -->
  <link rel="stylesheet" href="../src/css/common.css">
  <link rel="stylesheet" href="../src/css/host.css">
  
  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <!-- Scanline Effect -->
  <div class="scanlines"></div>
  
  <div id="app">
    <!-- Landing Screen: Show Room Code & QR -->
    <div id="landing-screen">
      <div class="logo">🎮 RETRO CONSOLE</div>
      
      <div class="room-code-container">
        <h2>Room Code</h2>
        <div class="room-code" id="room-code">----</div>
        <p class="instructions">Enter this code on your mobile device to connect as a controller</p>
      </div>
      
      <div class="qr-code-container">
        <div id="qrcode"></div>
      </div>
      
      <button id="start-button" class="btn" disabled>
        <span id="button-text">Waiting for controller...</span>
      </button>
      
      <p class="instructions mt-lg">
        Scan the QR code or visit <strong id="controller-url"></strong> on your phone
      </p>
    </div>

    <!-- Game Selection Screen -->
    <div id="game-selection" class="hidden">
      <div class="game-selection-header">
        <h1>Select a Game</h1>
        <div class="connected-controllers" id="controllers-list"></div>
        <div class="gamepad-status" id="gamepad-status" style="margin-top: 10px; color: #00d9ff;"></div>
      </div>

      <!-- Pre-loaded Games -->
      <div class="game-section">
        <h2 class="section-title">📚 Game Library</h2>
        <div class="games-grid" id="games-grid">
          <!-- Games will be populated here -->
        </div>
      </div>

      <!-- Upload Custom ROM -->
      <div class="game-section">
        <h2 class="section-title">📂 Upload Custom ROM</h2>
        <div class="upload-section">
          <div class="upload-area" onclick="document.getElementById('rom-file').click()">
            <div class="upload-icon">⬆️</div>
            <h3>Click to Upload ROM</h3>
            <p>Supports: NES, SNES, Genesis, N64, GBA, PSX</p>
            <input type="file" id="rom-file" accept=".nes,.sfc,.smc,.bin,.md,.gen,.gba,.n64,.z64,.iso,.cue">
          </div>
        </div>
      </div>
    </div>

    <!-- Emulator Container -->
    <div id="emulator-container">
      <div class="emulator-controls">
        <button class="control-btn" id="fullscreen-btn">Fullscreen</button>
        <button class="control-btn" id="switch-controller-btn" style="display:none;">Switch Controller</button>
        <button class="control-btn" id="exit-game-btn">Exit Game</button>
      </div>
      
      <!-- Main game container - EmulatorJS will render here -->
      <div id="game"></div>
      
      <div class="game-info-overlay hidden" id="game-info">
        <div class="game-info-title" id="game-info-title"></div>
        <div class="game-info-meta" id="game-info-meta"></div>
      </div>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script type="module">
    import { PeerManager } from '../src/js/peer-manager.js';
    import { EmulatorBridge } from '../src/js/emulator-bridge.js';
    import { GameManager } from '../src/js/game-manager.js';
    import { GamepadManager } from '../src/js/gamepad-manager.js';
    import { 
      generateQRCode, 
      showNotification, 
      requestFullscreen, 
      log,
      getUrlParameter
    } from '../src/js/utils.js';

    // Application State
    let peerManager;
    let emulatorBridge;
    let gameManager;
    let gamepadManager;
    let connectedControllers = 0;

    // Initialize the application
    async function init() {
      try {
        log('Initializing host application...');

        // Initialize PeerJS
        peerManager = new PeerManager(true);
        const { roomCode } = await peerManager.initialize();
        
        // Display room code
        document.getElementById('room-code').textContent = roomCode;
        
        // Generate QR Code
        const isLocalhost = ['127.0.0.1', 'localhost'].includes(window.location.hostname);
        const url = isLocalhost ? 'http://192.168.2.58:5500' : `${window.location.origin}/retrogame`;
        const controllerUrl = `${url}/controllers/?code=${roomCode}`;
        document.getElementById('controller-url').textContent = controllerUrl;
        generateQRCode(controllerUrl, 'qrcode');

        
        // Initialize Emulator Bridge
        emulatorBridge = new EmulatorBridge();
        await emulatorBridge.initialize();
        emulatorBridge.setEmulatorElement(document.getElementById('game'));

        // Initialize Game Manager
        gameManager = new GameManager();
        await gameManager.initialize();
        populateGameLibrary();

        // Initialize Physical Gamepad Manager
        gamepadManager = new GamepadManager(emulatorBridge);
        gamepadManager.initialize();
        
        // Check if gamepad is already connected
        if (gamepadManager.hasGamepad()) {
          showNotification('Physical gamepad detected!', 'success');
        }

        // Setup event listeners
        setupEventListeners();
        
        // Handle incoming controller connections
        peerManager.onConnection((controllerId) => {
          connectedControllers++;
          updateControllersList();
          enableStartButton();
        });

        // Handle controller disconnections
        peerManager.onDisconnection((controllerId) => {
          connectedControllers = Math.max(0, connectedControllers - 1);
          updateControllersList();
          
          // Auto-promote next controller if the active one disconnected
          if (connectedControllers > 0) {
            const remainingControllers = Array.from(peerManager.connections.values());
            if (remainingControllers.length > 0 && !remainingControllers[0].active) {
              // First remaining controller becomes active
              peerManager.setActiveController(remainingControllers[0].controllerId);
              showNotification(`Controller ${remainingControllers[0].controllerId} is now active`, 'info');
            }
          }
        });

        // Handle incoming controller data
        peerManager.onData((data, controllerId) => {
          if (data.type === 'input') {
            // Route input to emulator bridge
            emulatorBridge.handleControllerInput(data);
          }
        });

        log('Host application initialized successfully');
        showNotification('Waiting for controllers to connect...', 'info');

      } catch (error) {
        console.error('Initialization error:', error);
        showNotification('Failed to initialize host', 'error');
      }
    }

    // Setup event listeners
    function setupEventListeners() {
      // Start button
      document.getElementById('start-button').addEventListener('click', showGameSelection);

      // ROM upload
      document.getElementById('rom-file').addEventListener('change', handleRomUpload);

      // Emulator controls
      document.getElementById('fullscreen-btn').addEventListener('click', () => {
        requestFullscreen(document.getElementById('emulator-container'));
      });

      document.getElementById('exit-game-btn').addEventListener('click', exitGame);

      // Switch controller button
      document.getElementById('switch-controller-btn').addEventListener('click', () => {
        const controllers = Array.from(peerManager.connections.values());
        if (controllers.length < 2) return;
        
        // Find current active
        const currentActive = controllers.find(c => c.active);
        if (!currentActive) return;
        
        // Find next controller
        const currentIndex = controllers.indexOf(currentActive);
        const nextIndex = (currentIndex + 1) % controllers.length;
        const nextController = controllers[nextIndex];
        
        // Switch
        peerManager.setActiveController(nextController.controllerId);
        showNotification(`Switched to Controller ${nextController.controllerId}`, 'info');
        updateControllersList();
      });

      // Game start callback
      gameManager.onGameStart((game) => {
        showEmulator(game);
        // Start physical gamepad polling when game starts
        if (gamepadManager) {
          gamepadManager.start();
        }
      });
    }

    // Enable start button when controller connects
    function enableStartButton() {
      const button = document.getElementById('start-button');
      const buttonText = document.getElementById('button-text');
      button.disabled = false;
      buttonText.textContent = 'Start Gaming';
    }

    // Update controllers list display
    function updateControllersList() {
      const listContainer = document.getElementById('controllers-list');
      listContainer.innerHTML = '';
      
      const controllers = Array.from(peerManager.connections.values());
      
      controllers.forEach(controllerData => {
        const indicator = document.createElement('div');
        indicator.className = 'controller-indicator' + (controllerData.active ? ' active' : '');
        indicator.textContent = `📱 Controller ${controllerData.controllerId}${controllerData.active ? ' - ACTIVE' : ''}`;
        indicator.style.opacity = controllerData.active ? '1' : '0.5';
        listContainer.appendChild(indicator);
      });

      // Update gamepad status
      const gamepadStatus = document.getElementById('gamepad-status');
      if (gamepadManager && gamepadManager.hasGamepad()) {
        const gamepads = gamepadManager.getConnectedGamepads();
        gamepadStatus.textContent = `🎮 Physical Gamepad: ${gamepads[0].id}`;
      } else {
        gamepadStatus.textContent = '';
      }

      // Show/hide switch button
      const switchBtn = document.getElementById('switch-controller-btn');
      if (controllers.length > 1) {
        switchBtn.style.display = 'inline-block';
      } else {
        switchBtn.style.display = 'none';
      }
    }

    // Show game selection screen
    function showGameSelection() {
      document.getElementById('landing-screen').classList.add('hidden');
      document.getElementById('game-selection').classList.remove('hidden');
    }

    // Populate game library from config
    function populateGameLibrary() {
      const gamesGrid = document.getElementById('games-grid');
      const games = gameManager.getGames();

      games.forEach(game => {
        const gameCard = document.createElement('div');
        gameCard.className = 'game-card';
        gameCard.innerHTML = `
          <div class="game-cover">🎮</div>
          <div class="game-title">${game.title}</div>
          <div class="game-system">${game.system.toUpperCase()}</div>
        `;
        
        gameCard.addEventListener('click', () => {
          gameManager.loadGame(game.id);
        });

        gamesGrid.appendChild(gameCard);
      });
    }

    // Handle ROM file upload
    async function handleRomUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      await gameManager.loadCustomRom(file);
    }

    // Show emulator screen
    function showEmulator(game) {
      document.getElementById('game-selection').classList.add('hidden');
      document.getElementById('emulator-container').classList.add('active');

      // Show game info
      const gameInfo = document.getElementById('game-info');
      document.getElementById('game-info-title').textContent = game.title;
      document.getElementById('game-info-meta').textContent = 
        game.system ? `${game.system.toUpperCase()} • ${game.releaseYear || 'Custom ROM'}` : 'Custom ROM';
      
      gameInfo.classList.remove('hidden');
      setTimeout(() => gameInfo.classList.add('hidden'), 5000);
    }

    // Exit game and return to selection
    function exitGame() {
      // Stop physical gamepad polling
      if (gamepadManager) {
        gamepadManager.stop();
      }
      
      gameManager.stopEmulator();
      document.getElementById('emulator-container').classList.remove('active');
      document.getElementById('game-selection').classList.remove('hidden');
    }

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (peerManager) {
        peerManager.destroy();
      }
      if (emulatorBridge) {
        emulatorBridge.releaseAllKeys();
      }
    });

    // Start the application
    init();
  </script>
</body>
</html>
