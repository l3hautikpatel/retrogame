<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Retro Console Host - Display games and manage controllers">
    <title>Retro Console - Host</title>
    <link rel="stylesheet" href="../src/css/common.css">
    <link rel="stylesheet" href="../src/css/host.css">

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>
    <!-- Room Code Badge (Top Left) -->
    <div id="room-code-badge">
        <span id="room-code-small">----</span>
        <button id="show-qr-btn" class="btn-icon" title="Show QR Code">📱</button>
    </div>

    <!-- Controller Status Indicator (Top Right) -->
    <div id="controller-indicator">
        <span id="controller-count">0</span> 🎮
    </div>

    <div id="host-container">
        <!-- Game Selection View (Default) -->
        <div id="game-selection-view" class="view active">
            <div id="game-selection-header">
                <h1>🎮 SELECT A GAME</h1>
                <p class="text-muted">Choose a game or upload your own ROM</p>
            </div>

            <div id="game-grid">
                <!-- Games will be populated here -->
            </div>

            <div id="custom-rom-upload">
                <h3>Or Upload Custom ROM</h3>
                <input type="file" id="rom-file-input"
                    accept=".nes,.sfc,.smc,.bin,.md,.gen,.n64,.z64,.gba,.gb,.gbc,.iso">
                <label for="rom-file-input" id="rom-file-label">
                    📁 Choose ROM File
                </label>
                <div id="rom-file-name"></div>
            </div>
        </div>

        <!-- Game Playing View -->
        <div id="game-playing-view" class="view">
            <div id="game-controls-bar">
                <button id="back-to-games-btn" class="btn btn-small">← Back to Games</button>
                <span id="current-game-title"></span>
                <button id="fullscreen-btn" class="btn btn-small btn-secondary">⛶ Fullscreen</button>
            </div>

            <div id="game-container">
                <div id="game"></div>
            </div>
        </div>
    </div>

    <!-- QR Code Popup (Shows when no controllers connected) -->
    <div id="qr-popup" class="popup">
        <div class="popup-content">
            <button id="close-qr-popup" class="close-btn">×</button>
            <h2>Connect Controller</h2>
            <p>Scan this QR code with your phone</p>
            <div id="qrcode"></div>
            <div id="room-code-display-popup">----</div>
            <p class="text-muted">Or enter code manually in controller app</p>
        </div>
    </div>

    <!-- JavaScript Modules -->
    <script src="../src/js/utils.js"></script>
    <script src="../src/js/peer-manager.js"></script>
    <script src="../src/js/emulator-bridge.js"></script>
    <script src="../src/js/game-manager.js"></script>
    <script src="../src/js/gamepad-manager.js"></script>

    <!-- Host Application Script -->
    <script>
        // Global instances
        let peerManager;
        let emulatorBridge;
        let gameManager;
        let gamepadManager;
        let controllerCount = 0;

        // Initialize application
        async function init() {
            Utils.log('Initializing host application...');

            // Initialize managers
            peerManager = new PeerManager(true);
            emulatorBridge = new EmulatorBridge();
            gameManager = new GameManager();
            gamepadManager = new GamepadManager(emulatorBridge);

            // Load configurations
            await emulatorBridge.initialize();
            await gameManager.initialize();

            // Initialize peer connection
            const { roomCode } = await peerManager.initialize();

            // Display room code in badge
            document.getElementById('room-code-small').textContent = roomCode;
            document.getElementById('room-code-display-popup').textContent = roomCode;

            // Generate QR code
            const baseUrl = window.location.origin;
            Utils.generateQRCode(roomCode, 'qrcode', baseUrl);

            // Setup peer event listeners
            setupPeerListeners();

            // Setup UI event listeners
            setupUIListeners();

            // Initialize gamepad support
            gamepadManager.initialize();

            // Populate game list
            populateGameGrid();

            // Show QR popup initially (no controllers connected)
            showQRPopup();

            Utils.log('Host initialized successfully');
        }

        // Setup peer connection listeners
        function setupPeerListeners() {
            peerManager.onConnection((controllerId, connection) => {
                Utils.log('Controller connected:', controllerId);
                controllerCount++;
                updateControllerCount();
                hideQRPopup();
            });

            peerManager.onDisconnection((controllerId) => {
                Utils.log('Controller disconnected:', controllerId);
                controllerCount--;
                updateControllerCount();

                // If disconnected controller was active, switch to next available
                if (controllerId === peerManager.getActiveController()) {
                    const remainingControllers = peerManager.getControllerIds();
                    if (remainingControllers.length > 0) {
                        // Switch to first remaining controller
                        peerManager.setActiveController(remainingControllers[0]);
                        Utils.log('Switched active controller to:', remainingControllers[0]);
                    }
                }

                // Show QR popup if all controllers disconnected
                if (controllerCount === 0) {
                    showQRPopup();
                }
            });

            peerManager.onData((data, controllerId) => {
                handleControllerData(data, controllerId);
            });
        }

        // Handle data from controller
        function handleControllerData(data, controllerId) {
            if (!data || !data.type) return;

            Utils.log('Received data from controller', controllerId, ':', data);

            switch (data.type) {
                case 'input':
                    // Pass input to emulator bridge
                    Utils.log('Processing input:', data.button, data.action);
                    emulatorBridge.handleControllerInput(data);
                    break;

                case 'request_control':
                    // Switch active controller
                    peerManager.setActiveController(controllerId);
                    break;
            }
        }

        // Update controller count display
        function updateControllerCount() {
            document.getElementById('controller-count').textContent = controllerCount;
        }

        // Show QR popup
        function showQRPopup() {
            document.getElementById('qr-popup').classList.add('active');
        }

        // Hide QR popup
        function hideQRPopup() {
            document.getElementById('qr-popup').classList.remove('active');
        }

        // Switch to game selection view
        function showGameSelection() {
            document.getElementById('game-selection-view').classList.add('active');
            document.getElementById('game-playing-view').classList.remove('active');
        }

        // Switch to game playing view
        function showGamePlaying(gameTitle) {
            document.getElementById('game-selection-view').classList.remove('active');
            document.getElementById('game-playing-view').classList.add('active');
            document.getElementById('current-game-title').textContent = gameTitle;
        }

        // Setup UI event listeners
        function setupUIListeners() {
            // Show QR button
            document.getElementById('show-qr-btn').addEventListener('click', () => {
                showQRPopup();
            });

            // Close QR popup
            document.getElementById('close-qr-popup').addEventListener('click', () => {
                hideQRPopup();
            });

            // Close popup on background click
            document.getElementById('qr-popup').addEventListener('click', (e) => {
                if (e.target.id === 'qr-popup') {
                    hideQRPopup();
                }
            });

            // ROM file input
            document.getElementById('rom-file-input').addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (file) {
                    document.getElementById('rom-file-name').textContent = `Selected: ${file.name}`;
                    await loadCustomRom(file);
                }
            });

            // Back to games button
            document.getElementById('back-to-games-btn').addEventListener('click', () => {
                gameManager.stopEmulator();
                showGameSelection();
            });

            // Fullscreen button
            document.getElementById('fullscreen-btn').addEventListener('click', () => {
                const container = document.getElementById('game-container');
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            });
        }

        // Populate game grid
        function populateGameGrid() {
            const gameGrid = document.getElementById('game-grid');
            const games = gameManager.getGames();

            gameGrid.innerHTML = '';

            games.forEach(game => {
                const gameCard = document.createElement('div');
                gameCard.className = 'game-card';
                gameCard.innerHTML = `
                    <div class="game-icon">🎮</div>
                    <h3>${game.title}</h3>
                    <p>${game.system}</p>
                    <p class="text-muted">${game.description || ''}</p>
                `;

                gameCard.addEventListener('click', () => {
                    loadGame(game.id);
                });

                gameGrid.appendChild(gameCard);
            });
        }

        // Load game from library
        async function loadGame(gameId) {
            Utils.log('Loading game:', gameId);

            // Get game info
            const game = gameManager.getGameById(gameId);
            if (!game) return;

            // Set mapping scheme
            if (game.mapping) {
                emulatorBridge.setMappingScheme(game.mapping);
            }

            // Load game
            await gameManager.loadGame(gameId);

            // Switch to playing view
            showGamePlaying(game.title);
        }

        // Load custom ROM
        async function loadCustomRom(file) {
            Utils.log('Loading custom ROM:', file.name);

            // Load ROM
            const success = await gameManager.loadCustomRom(file);

            if (success) {
                const currentGame = gameManager.getCurrentGame();
                if (currentGame && currentGame.mapping) {
                    emulatorBridge.setMappingScheme(currentGame.mapping);
                }

                // Switch to playing view
                showGamePlaying(file.name);
            }
        }

        // Start application when page loads
        window.addEventListener('load', init);
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (peerManager) {
                peerManager.destroy();
            }
            if (gamepadManager) {
                gamepadManager.stop();
            }
        });
    </script>
</body>

</html>
