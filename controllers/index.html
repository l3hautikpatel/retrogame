<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Retro Console Controller - Use your phone as a wireless gamepad">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Retro Console - Controller</title>
    <link rel="stylesheet" href="../src/css/common.css">
    <link rel="stylesheet" href="../src/css/controller.css">

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>

<body>
    <div id="controller-container">
        <!-- Connection Screen -->
        <div id="connection-screen">
            <h1>🎮 CONTROLLER</h1>
            <p>Enter the room code from the host screen</p>

            <input type="number" id="room-code-input" placeholder="Enter 4-digit code" maxlength="4" pattern="[0-9]{4}">

            <button id="connect-btn" class="btn btn-large">Connect</button>

            <p class="text-muted mt-lg">Or scan the QR code on the host screen</p>
        </div>

        <!-- Gamepad Screen -->
        <div id="gamepad-screen">
            <!-- Triggers (Top) -->
            <div id="triggers">
                <div class="trigger-group">
                    <button id="btn-l2" class="trigger-btn">L2</button>
                    <button id="btn-l" class="trigger-btn">L</button>
                </div>
                <div class="trigger-group">
                    <button id="btn-r" class="trigger-btn">R</button>
                    <button id="btn-r2" class="trigger-btn">R2</button>
                </div>
            </div>

            <!-- Main Gamepad -->
            <div id="gamepad">
                <!-- D-Pad (Left) -->
                <div id="dpad">
                    <button id="btn-up" class="dpad-btn">▲</button>
                    <button id="btn-left" class="dpad-btn">◄</button>
                    <button id="btn-right" class="dpad-btn">►</button>
                    <button id="btn-down" class="dpad-btn">▼</button>
                </div>

                <!-- Virtual Joystick (Alternative to D-Pad) -->
                <div id="virtual-joystick">
                    <div id="joystick-base"></div>
                    <div id="joystick-stick"></div>
                </div>

                <!-- Center Buttons -->
                <div id="center-buttons">
                    <button id="btn-select" class="system-btn">SELECT</button>
                    <button id="btn-start" class="system-btn">START</button>
                </div>

                <!-- Face Buttons (Right) -->
                <div id="face-buttons">
                    <button id="btn-y" class="face-btn">Y</button>
                    <button id="btn-b" class="face-btn">B</button>
                    <button id="btn-a" class="face-btn">A</button>
                    <button id="btn-x" class="face-btn">X</button>
                    <button id="btn-c" class="face-btn" style="display: none;">C</button>
                    <button id="btn-z" class="face-btn" style="display: none;">Z</button>
                </div>
            </div>

            <!-- Status Bar (Bottom) -->
            <div id="status-bar">
                <div id="status-info">
                    <span class="status-dot disconnected" id="status-dot"></span>
                    <span id="status-text">Not Connected</span>
                    <span id="controller-info"></span>
                </div>
                <div id="status-actions">
                    <button id="toggle-dpad" class="btn btn-small">🕹️ Joystick</button>
                    <button id="toggle-triggers" class="btn btn-small btn-secondary">Hide Triggers</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Modules -->
    <script src="../src/js/utils.js"></script>
    <script src="../src/js/peer-manager.js"></script>
    <script src="../src/js/controller-ui.js"></script>

    <!-- Controller Application Script -->
    <script>
        // Global instances
        let peerManager;
        let controllerUI;
        let controllerId = null;
        let isActive = false;
        let roomCode = null; // Store room code

        // Initialize application
        async function init() {
            Utils.log('Initializing controller application...');

            // Initialize managers
            peerManager = new PeerManager(false);
            controllerUI = new ControllerUI(peerManager);

            // Initialize UI
            controllerUI.initialize();

            // Check for room code in URL
            const urlCode = Utils.getUrlParameter('code');
            if (urlCode) {
                document.getElementById('room-code-input').value = urlCode;
                // Auto-connect if code is in URL
                setTimeout(() => {
                    connectToHost();
                }, 500);
            }

            // Setup UI event listeners
            setupUIListeners();

            Utils.log('Controller initialized successfully');
        }

        // Setup UI event listeners
        function setupUIListeners() {
            // Connect button
            document.getElementById('connect-btn').addEventListener('click', connectToHost);

            // Enter key on input
            document.getElementById('room-code-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    connectToHost();
                }
            });
        }

        // Connect to host
        async function connectToHost() {
            const roomCodeInput = document.getElementById('room-code-input');
            const inputRoomCode = roomCodeInput.value.trim();

            if (!inputRoomCode || inputRoomCode.length !== 4) {
                Utils.showToast('Please enter a 4-digit room code', 'error');
                return;
            }

            // Store room code globally
            roomCode = inputRoomCode;

            Utils.log('Connecting to host with code:', roomCode);
            Utils.showToast('Connecting...', 'info');

            try {
                // Initialize peer
                await peerManager.initialize();

                // Setup peer listeners
                setupPeerListeners();

                // Connect to host
                await peerManager.connectToHost(roomCode);

                // Show gamepad screen
                document.getElementById('connection-screen').classList.add('hidden');
                document.getElementById('gamepad-screen').classList.add('active');

                Utils.showToast('Connected!', 'success');
            } catch (error) {
                Utils.error('Connection failed:', error);
                Utils.showToast('Connection failed. Check room code.', 'error');
            }
        }

        // Setup peer connection listeners
        function setupPeerListeners() {
            peerManager.onData((data) => {
                handleHostData(data);
            });

            peerManager.onDisconnection(() => {
                Utils.log('Disconnected from host');
                controllerUI.updateConnectionStatus(false, null, false);
                Utils.showToast('Disconnected from host', 'error');

                // Return to connection screen
                setTimeout(() => {
                    document.getElementById('gamepad-screen').classList.remove('active');
                    document.getElementById('connection-screen').classList.remove('hidden');
                }, 2000);
            });
        }

        // Handle data from host
        function handleHostData(data) {
            if (!data || !data.type) return;

            switch (data.type) {
                case 'welcome':
                    // Received controller ID and active status
                    controllerId = data.controllerId;
                    isActive = data.isActive;
                    controllerUI.updateConnectionStatus(true, controllerId, isActive, roomCode);
                    controllerUI.showControllerInfo(controllerId);
                    Utils.log('Received welcome:', controllerId, 'Active:', isActive);
                    break;

                case 'active_status':
                    // Active status changed
                    if (data.controllerId === controllerId) {
                        isActive = data.isActive;
                        controllerUI.setActiveStatus(isActive);

                        if (isActive) {
                            Utils.showToast('You are now active!', 'success');
                        } else {
                            Utils.showToast('You are now inactive', 'info');
                        }
                    }
                    break;

                case 'layout_update':
                    // Update controller layout
                    if (controllerUI) {
                        controllerUI.updateLayout(data.layout);
                    }
                    break;
            }
        }

        // Prevent page refresh on pull-down
        document.body.addEventListener('touchmove', (e) => {
            if (document.getElementById('gamepad-screen').classList.contains('active')) {
                e.preventDefault();
            }
        }, { passive: false });

        // Prevent zoom on double-tap
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        // Keep screen awake (if supported)
        if ('wakeLock' in navigator) {
            let wakeLock = null;

            async function requestWakeLock() {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    Utils.log('Wake lock acquired');
                } catch (err) {
                    Utils.error('Wake lock error:', err);
                }
            }

            // Request wake lock when gamepad is active
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' &&
                    document.getElementById('gamepad-screen').classList.contains('active')) {
                    requestWakeLock();
                }
            });
        }

        // Start application when page loads
        window.addEventListener('load', init);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (peerManager) {
                peerManager.destroy();
            }
            if (controllerUI) {
                controllerUI.releaseAllButtons();
            }
        });
    </script>
</body>

</html>
