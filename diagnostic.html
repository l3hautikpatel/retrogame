<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Console - Diagnostic Tool</title>
    <link rel="stylesheet" href="src/css/common.css">
    <style>
        #diagnostic-container {
            max-width: 800px;
            margin: 0 auto;
            padding: var(--spacing-xl);
        }

        .test-section {
            background: var(--bg-light);
            border: 1px solid var(--primary-color);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .test-result {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-sm);
            margin: var(--spacing-sm) 0;
        }

        .test-result .icon {
            font-size: 24px;
        }

        .test-result.pass .icon {
            color: var(--primary-color);
        }

        .test-result.fail .icon {
            color: var(--error-color);
        }

        .test-result.warn .icon {
            color: var(--warning-color);
        }

        #log-output {
            background: var(--bg-dark);
            border: 1px solid var(--text-muted);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            height: 300px;
            overflow-y: auto;
            font-family: var(--font-family);
            font-size: var(--font-size-sm);
            color: var(--primary-color);
        }

        .log-entry {
            margin-bottom: var(--spacing-xs);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>

<body>
    <div id="diagnostic-container">
        <h1>🔧 DIAGNOSTIC TOOL</h1>
        <p>Test your browser's compatibility and network connectivity</p>

        <!-- Browser Support -->
        <div class="test-section">
            <h2>Browser Support</h2>
            <div id="browser-tests"></div>
        </div>

        <!-- Network Test -->
        <div class="test-section">
            <h2>Network Test</h2>
            <button id="test-connection-btn" class="btn">Test PeerJS Connection</button>
            <div id="network-tests"></div>
        </div>

        <!-- System Info -->
        <div class="test-section">
            <h2>System Information</h2>
            <div id="system-info"></div>
        </div>

        <!-- Log Output -->
        <div class="test-section">
            <h2>Debug Log</h2>
            <div id="log-output"></div>
        </div>
    </div>

    <script>
        // Logging
        function log(message, type = 'info') {
            const logOutput = document.getElementById('log-output');
            const timestamp = new Date().toLocaleTimeString();
            const colors = { info: '#00ff00', error: '#ff4444', warn: '#ffaa00' };

            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.style.color = colors[type] || colors.info;
            entry.textContent = `[${timestamp}] ${message}`;

            logOutput.appendChild(entry);
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        // Add test result
        function addTestResult(containerId, name, passed, message = '') {
            const container = document.getElementById(containerId);
            const result = document.createElement('div');
            result.className = `test-result ${passed ? 'pass' : 'fail'}`;

            const icon = passed ? '✅' : '❌';
            result.innerHTML = `
        <span class="icon">${icon}</span>
        <div>
          <strong>${name}</strong>
          ${message ? `<br><span class="text-muted">${message}</span>` : ''}
        </div>
      `;

            container.appendChild(result);
        }

        // Browser support tests
        function testBrowserSupport() {
            log('Testing browser support...');

            // WebRTC
            const hasWebRTC = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
            addTestResult('browser-tests', 'WebRTC Support', hasWebRTC,
                hasWebRTC ? 'Your browser supports WebRTC' : 'WebRTC not supported');
            log(`WebRTC: ${hasWebRTC ? 'Supported' : 'Not supported'}`, hasWebRTC ? 'info' : 'error');

            // PeerJS
            const hasPeerJS = typeof Peer !== 'undefined';
            addTestResult('browser-tests', 'PeerJS Library', hasPeerJS,
                hasPeerJS ? 'PeerJS loaded successfully' : 'PeerJS failed to load');
            log(`PeerJS: ${hasPeerJS ? 'Loaded' : 'Not loaded'}`, hasPeerJS ? 'info' : 'error');

            // Vibration API
            const hasVibration = 'vibrate' in navigator;
            addTestResult('browser-tests', 'Vibration API', hasVibration,
                hasVibration ? 'Haptic feedback available' : 'Haptic feedback not available');
            log(`Vibration API: ${hasVibration ? 'Available' : 'Not available'}`, 'info');

            // Gamepad API
            const hasGamepad = 'getGamepads' in navigator;
            addTestResult('browser-tests', 'Gamepad API', hasGamepad,
                hasGamepad ? 'Physical gamepad support available' : 'Gamepad API not supported');
            log(`Gamepad API: ${hasGamepad ? 'Available' : 'Not available'}`, 'info');

            // Fullscreen API
            const hasFullscreen = document.fullscreenEnabled || document.webkitFullscreenEnabled;
            addTestResult('browser-tests', 'Fullscreen API', hasFullscreen,
                hasFullscreen ? 'Fullscreen mode available' : 'Fullscreen not supported');
            log(`Fullscreen API: ${hasFullscreen ? 'Available' : 'Not available'}`, 'info');
        }

        // Network connection test
        async function testNetworkConnection() {
            log('Testing PeerJS connection...');

            const networkTests = document.getElementById('network-tests');
            networkTests.innerHTML = '<p class="text-muted">Testing connection...</p>';

            try {
                const testId = `test-${Math.random().toString(36).substr(2, 9)}`;
                log(`Creating test peer with ID: ${testId}`);

                const peer = new Peer(testId, {
                    config: {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' }
                        ]
                    },
                    debug: 2
                });

                peer.on('open', (id) => {
                    log(`Peer connection opened: ${id}`, 'info');
                    networkTests.innerHTML = '';
                    addTestResult('network-tests', 'PeerJS Connection', true,
                        `Successfully connected to signaling server with ID: ${id}`);

                    // Cleanup
                    setTimeout(() => {
                        peer.destroy();
                        log('Test peer destroyed');
                    }, 2000);
                });

                peer.on('error', (error) => {
                    log(`Peer error: ${error.type} - ${error.message}`, 'error');
                    networkTests.innerHTML = '';
                    addTestResult('network-tests', 'PeerJS Connection', false,
                        `Error: ${error.type} - ${error.message}`);
                });

            } catch (error) {
                log(`Connection test failed: ${error.message}`, 'error');
                networkTests.innerHTML = '';
                addTestResult('network-tests', 'PeerJS Connection', false,
                    `Failed to initialize: ${error.message}`);
            }
        }

        // System information
        function displaySystemInfo() {
            const systemInfo = document.getElementById('system-info');

            const info = [
                { label: 'User Agent', value: navigator.userAgent },
                { label: 'Platform', value: navigator.platform },
                { label: 'Language', value: navigator.language },
                { label: 'Online', value: navigator.onLine ? 'Yes' : 'No' },
                { label: 'Screen Size', value: `${window.screen.width}x${window.screen.height}` },
                { label: 'Viewport Size', value: `${window.innerWidth}x${window.innerHeight}` },
                { label: 'Device Pixel Ratio', value: window.devicePixelRatio },
                { label: 'Touch Support', value: 'ontouchstart' in window ? 'Yes' : 'No' }
            ];

            info.forEach(item => {
                const row = document.createElement('div');
                row.className = 'test-result';
                row.innerHTML = `
          <div>
            <strong>${item.label}:</strong> <span class="text-muted">${item.value}</span>
          </div>
        `;
                systemInfo.appendChild(row);
            });

            log('System information displayed');
        }

        // Initialize
        window.addEventListener('load', () => {
            log('Diagnostic tool initialized');
            testBrowserSupport();
            displaySystemInfo();

            document.getElementById('test-connection-btn').addEventListener('click', testNetworkConnection);
        });
    </script>
</body>

</html>
